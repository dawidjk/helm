  <title id="title">Field security guide</title><desc id="desc">A work device uses a protected connection to reach office systems.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#28351b"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/>
