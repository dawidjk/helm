<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" role="img" aria-labelledby="title desc">
<title id="title">Illustrative monthly staff time with and without AI</title><desc id="desc">Twenty internal checklists require 600 minutes without AI. The hypothetical AI workflow uses 400 minutes for preparation, generation, review and corrections, plus 60 minutes of maintenance, totaling 460 minutes. The difference is 140 minutes. Setup and software fees are not included in this staff-time chart.</desc>
<rect width="400" height="530" rx="18" fill="#f4f1e9"/>
<g fill="#244c43" font-family="Arial,sans-serif"><text x="32" y="46" font-size="12" letter-spacing="1.5">ILLUSTRATIVE EXAMPLE</text><text x="32" y="80" font-size="24">Count the whole task</text><text x="32" y="108" font-size="14">20 accepted internal checklists per month</text>
<text x="32" y="158" font-size="15">Existing process</text><rect x="32" y="173" width="336" height="34" rx="4" fill="#244c43"/><text x="356" y="196" font-size="14" text-anchor="end" fill="#fff">600 minutes</text>
<text x="32" y="244" font-size="15">AI-assisted process</text><rect x="32" y="259" width="224" height="34" fill="#4e7668"/><rect x="256" y="259" width="33.6" height="34" fill="#bfcdbd" stroke="#244c43"/><text x="32" y="318" font-size="19">460 minutes total</text>
<rect x="32" y="339" width="13" height="13" fill="#4e7668"/><text x="55" y="350" font-size="13">400 minutes: accepted checklist work</text><rect x="32" y="369" width="13" height="13" fill="#bfcdbd" stroke="#244c43"/><text x="55" y="380" font-size="13">60 minutes: monthly maintenance</text>
<path d="M32 403H368" stroke="#a4b5a9"/><text x="32" y="434" font-size="18">140 minutes of capacity released</text><text x="32" y="460" font-size="13">Checking and corrections are included.</text><text x="32" y="482" font-size="13">Setup and software fees are separate.</text><text x="32" y="505" font-size="11">Hypothetical assumptions. Not a customer result.</text></g></svg>