<svg xmlns="http://www.w3.org/2000/svg" width="400" height="530" viewBox="0 0 400 530" role="img" aria-labelledby="title desc">
<title id="title">Follow the DNS request</title><desc id="desc">A domain request travels from a covered device to a filtering resolver, which allows or blocks it under policy; an owner reviews exceptions and suspicious activity.</desc>
<rect width="400" height="530" fill="#f6f4ee"/>
<g font-family="Arial, sans-serif" fill="#183b33">
<text x="24" y="38" font-size="21" font-weight="700">Follow the DNS request</text>
<rect x="24" y="68" width="352" height="120" rx="8" fill="#fff" stroke="#537166"/>
<text x="40" y="94" font-size="15" fill="#4b655b">01</text>
<text x="40" y="120" font-size="18" font-weight="700">A device requests a domain</text>
<text x="40" y="147" font-size="16">Office and remote devices</text>
<text x="40" y="169" font-size="16">need a verified policy path.</text>
<path d="M200 194v12m-5-5 5 5 5-5" fill="none" stroke="#183b33" stroke-width="2"/>
<rect x="24" y="214" width="352" height="120" rx="8" fill="#fff" stroke="#537166"/>
<text x="40" y="240" font-size="15" fill="#4b655b">02</text>
<text x="40" y="266" font-size="18" font-weight="700">The resolver checks policy</text>
<text x="40" y="293" font-size="16">Allowed requests continue.</text>
<text x="40" y="315" font-size="16">Disallowed requests are blocked.</text>
<path d="M200 340v12m-5-5 5 5 5-5" fill="none" stroke="#183b33" stroke-width="2"/>
<rect x="24" y="360" width="352" height="120" rx="8" fill="#fff" stroke="#537166"/>
<text x="40" y="386" font-size="15" fill="#4b655b">03</text>
<text x="40" y="412" font-size="18" font-weight="700">Review the outcome</text>
<text x="40" y="439" font-size="16">Check interrupted work.</text>
<text x="40" y="461" font-size="16">Investigate suspicious activity.</text>
<text x="24" y="519" font-size="12" fill="#4b655b">HELM SECURITY · BUSINESS RESOURCE</text>
</g></svg>