<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Identity and access field guide</title><desc id="desc">Password, strong authentication factor, and limited access shown as connected security layers.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#123529"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/><circle cx="980" cy="92" r="180" fill="#38a169" opacity=".13" filter="url(#glow)"/>
  <text x="72" y="88" fill="#7ee0a3" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">HELM FIELD GUIDE</text>
  <text x="72" y="164" fill="#f1f7f4" font-family="Arial,sans-serif" font-size="48" font-weight="700">Identity needs layers.</text>
  <text x="72" y="207" fill="#b8c9c1" font-family="Arial,sans-serif" font-size="23">A password is the start, not the whole control.</text>
  <g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><rect x="72" y="320" width="282" height="128" rx="22" fill="#11283a" stroke="#6d8290"/><text x="213" y="395" fill="#f1f7f4" font-size="25">Password</text><path d="M374 384h78" stroke="#7ee0a3" stroke-width="8" stroke-linecap="round"/><path d="m437 368 19 16-19 16" fill="none" stroke="#7ee0a3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="476" y="320" width="282" height="128" rx="22" fill="#153d2e" stroke="#38a169"/><text x="617" y="380" fill="#f1f7f4" font-size="25">Strong factor</text><text x="617" y="411" fill="#9ddcb8" font-size="17">app or security key</text><path d="M778 384h78" stroke="#7ee0a3" stroke-width="8" stroke-linecap="round"/><path d="m841 368 19 16-19 16" fill="none" stroke="#7ee0a3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="880" y="320" width="248" height="128" rx="22" fill="#11283a" stroke="#6d8290"/><text x="1004" y="380" fill="#f1f7f4" font-size="25">Least access</text><text x="1004" y="411" fill="#b8c9c1" font-size="17">only what is needed</text></g>
</svg>
