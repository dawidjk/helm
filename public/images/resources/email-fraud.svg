<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Email and payment fraud field guide</title><desc id="desc">Inspect the sender, verify outside the email thread, and only then approve a payment change.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#2e2415"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <text x="72" y="88" fill="#7ee0a3" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">HELM FIELD GUIDE</text><text x="72" y="164" fill="#f1f7f4" font-family="Arial,sans-serif" font-size="48" font-weight="700">Slow the request down.</text><text x="72" y="207" fill="#c9c3b8" font-family="Arial,sans-serif" font-size="23">A separate verification step can stop a convincing fake.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="72" y="318" width="286" height="134" rx="22" fill="#11283a" stroke="#6d8290"/><text x="215" y="378" fill="#f1f7f4" font-size="24" font-weight="700">Inspect sender</text><text x="215" y="412" fill="#b8c9c1" font-size="17">address and context</text><path d="M382 385h76" stroke="#e6b85c" stroke-width="8" stroke-linecap="round"/><path d="m443 369 19 16-19 16" fill="none" stroke="#e6b85c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="318" width="286" height="134" rx="22" fill="#443619" stroke="#e6b85c"/><text x="623" y="378" fill="#fff5dd" font-size="24" font-weight="700">Verify outside email</text><text x="623" y="412" fill="#ecd6a9" font-size="17">known phone number</text><path d="M790 385h76" stroke="#7ee0a3" stroke-width="8" stroke-linecap="round"/><path d="m851 369 19 16-19 16" fill="none" stroke="#7ee0a3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="888" y="318" width="240" height="134" rx="22" fill="#153d2e" stroke="#38a169"/><text x="1008" y="378" fill="#f1f7f4" font-size="24" font-weight="700">Approve</text><text x="1008" y="412" fill="#9ddcb8" font-size="17">after confirmation</text></g>
</svg>
