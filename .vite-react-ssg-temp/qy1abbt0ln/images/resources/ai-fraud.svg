<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI-enabled fraud field guide</title><desc id="desc">Pause, verify identity through a separate channel, and only then approve.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#30203e"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <text x="72" y="88" fill="#7ee0a3" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">HELM FIELD GUIDE</text><text x="72" y="164" fill="#f1f7f4" font-family="Arial,sans-serif" font-size="48" font-weight="700">Urgency is a signal.</text><text x="72" y="207" fill="#c8bdd0" font-family="Arial,sans-serif" font-size="23">A familiar voice or writing style is not proof of identity.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="98" y="324" width="250" height="126" rx="63" fill="#45244d" stroke="#b06dcc"/><text x="223" y="396" fill="#f7edf9" font-size="25" font-weight="700">Pause</text><path d="M372 387h74" stroke="#b06dcc" stroke-width="8" stroke-linecap="round"/><rect x="470" y="310" width="330" height="154" rx="24" fill="#153d2e" stroke="#38a169"/><text x="635" y="378" fill="#f1f7f4" font-size="25" font-weight="700">Verify identity</text><text x="635" y="413" fill="#9ddcb8" font-size="17">known, separate channel</text><path d="M824 387h74" stroke="#7ee0a3" stroke-width="8" stroke-linecap="round"/><rect x="922" y="324" width="180" height="126" rx="63" fill="#11283a" stroke="#6d8290"/><text x="1012" y="396" fill="#f1f7f4" font-size="25" font-weight="700">Approve</text></g>
</svg>
