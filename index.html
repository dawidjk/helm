<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Vite rewrites this source asset in production. The SSG replaces it
         per route with that page's actual high-priority hero image. -->
    <link rel="preload" as="image" href="/src/assets/variants/japandi-hero.webp" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://connect.facebook.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com; font-src 'self' data:; connect-src 'self' https://app.helmsecured.com https://challenges.cloudflare.com https://www.facebook.com https://cloudflareinsights.com ws://localhost:* ws://127.0.0.1:*; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#05070d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8" />
    <!-- Theme pre-paint: apply saved light/dark choice before first paint (no flash). -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('helm-theme');
          if (m === 'light' || m === 'dark') {
            document.documentElement.setAttribute('data-theme', m);
          }
        } catch (e) {}
      })();
    </script>
    <!-- Inter is self-hosted via @fontsource (imported in src/index.css) -->
    <!-- title + description are set per-page via Head (see src/components/Meta.tsx) -->
  </head>
  <body>
    <!--
      THESIS: Helm is a composed, hospitality-minded security partner; this system refuses the category's cold neon command-center template.
      OWN-WORLD: Mineral paper and deep pine, ink-black type, warm oak accents, Tenor Sans display lettering, Manrope body copy, ruled lists, and restrained asymmetric curves.
      STORY: Visitors understand the four offers, see candid operating proof, choose a relevant industry path, and can start with a free scan or a founder conversation.
      FIRST VIEWPORT: A still sculptural helm fills the canvas; a left-aligned, high-contrast message and domain-scan action occupy the quiet third.
      FORM: User-pinned Japandi production system, inherited from the approved prototype; seed user-pinned-japandi-2026-08-04.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
